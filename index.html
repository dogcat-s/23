<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maze Target Practice</title>
  <style>
    :root{--fg:#cfe8ff;--bg1:#07101a;--bg2:#030616}
    html,body{height:100%;margin:0;font-family:monospace,system-ui,Segoe UI,Roboto,Arial}
    body{background:linear-gradient(180deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;color:var(--fg)}
    #game-wrap{position:relative;width:960px;max-width:96vw;height:640px;background:#021025;box-shadow:0 8px 30px rgba(0,0,0,.7);border-radius:8px;overflow:hidden}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    .hud{position:absolute;left:8px;top:8px;font-weight:700;letter-spacing:.6px;font-size:14px}
    .controls{position:absolute;right:8px;top:8px;font-size:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));padding:6px 8px;border-radius:6px}
    .center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .panel{pointer-events:auto;background:rgba(0,0,0,0.75);padding:12px 14px;border-radius:6px;color:var(--fg);text-align:center;border:2px solid rgba(255,255,255,0.03)}
    .footer{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:rgba(255,255,255,.4);font-size:11px}
    .scanlines{position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(transparent, rgba(0,0,0,0.06) 1px);mix-blend-mode:overlay}
    @media (max-width:640px){#game-wrap{height:56vw}}
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="c"></canvas>
    <div class="scanlines"></div>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div style="margin-top:6px">Time: <span id="time">0</span>s &nbsp; Targets: <span id="targets">0</span></div>
    </div>
    <div class="controls">Move: W/A/S/D &nbsp; Shoot: Space or Click</div>
    <div class="center-msg"><div id="start-panel" class="panel"><div style="font-size:18px;font-weight:800">MAZE TARGET PRACTICE</div><div style="margin-top:8px;font-size:12px">Move with WASD. Aim with mouse. Shoot targets before time runs out.</div><div style="margin-top:12px"><button id="startBtn">Start Round</button></div></div></div>
    <div class="footer">Top-down maze view • Side gun shown</div>
  </div>

  <script>
  (function(){
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('game-wrap');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const targetsEl = document.getElementById('targets');
    const startPanel = document.getElementById('start-panel');
    const startBtn = document.getElementById('startBtn');

    // virtual buffer for pixel look
    const VW = 320, VH = 200;
    const buffer = document.createElement('canvas'); buffer.width = VW; buffer.height = VH;
    const bctx = buffer.getContext('2d'); bctx.imageSmoothingEnabled = false;

    let W=960,H=640;
    function resize(){ const r = wrap.getBoundingClientRect(); W = Math.floor(r.width); H = Math.floor(r.height); canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio; canvas.style.width = W+'px'; canvas.style.height = H+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
    window.addEventListener('resize', resize); resize();

    // maze grid
    const tile = 8;
    const cols = Math.floor(VW / tile);
    const rows = Math.floor(VH / tile);
    let map = [];

    function initMap(){ map = new Array(rows); for(let y=0;y<rows;y++){ map[y] = new Array(cols).fill(1); } }

    function carveMaze(){
      const stack = [];
      const sx = 1, sy = 1;
      map[sy][sx] = 0; stack.push({x:sx,y:sy});
      while(stack.length){
        const cur = stack[stack.length-1];
        const dirs = [{x:2,y:0},{x:-2,y:0},{x:0,y:2},{x:0,y:-2}].sort(()=>Math.random()-0.5);
        let carved = false;
        for(const d of dirs){
          const nx = cur.x + d.x, ny = cur.y + d.y;
          if(nx>0 && nx<cols-1 && ny>0 && ny<rows-1 && map[ny][nx]===1){
            map[ny][nx]=0; map[cur.y + d.y/2][cur.x + d.x/2] = 0; stack.push({x:nx,y:ny}); carved=true; break;
          }
        }
        if(!carved) stack.pop();
      }
    }

    function generateMaze(){ initMap(); carveMaze(); }

    // player
    const player = { x: tile*2 + tile/2, y: tile*2 + tile/2, r: tile*0.45, speed: 60 };
    let mouse = { x: VW/2, y: VH/2 };
    let targets = [];
    let score = 0, timeLeft = 0, running = false, lastTime = 0, canShoot = true;

    function placeTargets(n){
      targets = [];
      const passages = [];
      for(let y=1;y<rows-1;y++) for(let x=1;x<cols-1;x++) if(map[y][x]===0) passages.push({x,y});
      for(let i=0;i<n && passages.length;i++){
        const idx = Math.floor(Math.random()*passages.length);
        const p = passages.splice(idx,1)[0];
        targets.push({ x: p.x*tile + tile/2, y: p.y*tile + tile/2, size: Math.floor(tile*0.9) });
      }
    }

    function worldToScreen(wx,wy){ return { x: Math.round(VW/2 + (wx - player.x)), y: Math.round(VH/2 + (wy - player.y)) }; }
    function screenToWorld(sx,sy){ return { x: player.x + (sx - VW/2), y: player.y + (sy - VH/2) }; }

    function isFree(nx, ny){ const r = player.r; const pts = [[nx-r, ny-r],[nx+r, ny-r],[nx-r, ny+r],[nx+r, ny+r]]; for(const p of pts){ const cx = Math.floor(p[0]/tile), cy = Math.floor(p[1]/tile); if(cx<0||cx>=cols||cy<0||cy>=rows) return false; if(map[cy][cx]===1) return false; } return true; }

    function shoot(){
      if(!canShoot || !running) return;
      canShoot = false; setTimeout(()=>canShoot=true, 160);
      const tw = screenToWorld(mouse.x, mouse.y);
      const ax = tw.x - player.x, ay = tw.y - player.y; const len = Math.hypot(ax,ay); if(len===0) return;
      const dx = ax/len, dy = ay/len; let sx = player.x, sy = player.y; const step = 4;
      for(let i=0;i<200;i++){
        sx += dx*step; sy += dy*step;
        const cx = Math.floor(sx / tile), cy = Math.floor(sy / tile);
        if(cx<0||cx>=cols||cy<0||cy>=rows) break;
        if(map[cy][cx]===1) break; // hit wall
        for(let ti=targets.length-1; ti>=0; ti--){ const t = targets[ti]; const dd = Math.hypot(sx - t.x, sy - t.y); if(dd < t.size*0.6){ targets.splice(ti,1); score+=10; scoreEl.textContent = score; targetsEl.textContent = targets.length; return; } }
      }
    }

    // input
    const keys = {};
    window.addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space'){ e.preventDefault(); shoot(); } });
    window.addEventListener('keyup', e=>{ keys[e.code]=false; });
    canvas.addEventListener('mousemove', e=>{ const r = canvas.getBoundingClientRect(); const sx = (e.clientX - r.left) / r.width * VW; const sy = (e.clientY - r.top) / r.height * VH; mouse.x = sx; mouse.y = sy; });
    canvas.addEventListener('click', ()=> shoot());

    startBtn.addEventListener('click', ()=>{
      generateMaze(); placeTargets(8);
      // position player at first free cell
      let placed=false;
      for(let y=1;y<rows-1 && !placed;y++) for(let x=1;x<cols-1 && !placed;x++) if(map[y][x]===0){ player.x = x*tile + tile/2; player.y = y*tile + tile/2; placed=true; }
      timeLeft = 80; score = 0; scoreEl.textContent = 0; targetsEl.textContent = targets.length; running=true; startPanel.style.display='none'; lastTime = performance.now(); requestAnimationFrame(loop);
    });

    function update(dt){ const sp = player.speed * dt/1000; let nx=player.x, ny=player.y; if(keys['KeyA']) nx -= sp; if(keys['KeyD']) nx += sp; if(keys['KeyW']) ny -= sp; if(keys['KeyS']) ny += sp; if(isFree(nx,ny)){ player.x = nx; player.y = ny; }
      if(running){ timeLeft -= dt/1000; if(timeLeft<0) timeLeft=0; timeEl.textContent = Math.ceil(timeLeft); if(timeLeft<=0 && targets.length>0){ running=false; startPanel.style.display='block'; startPanel.innerHTML = '<div style="font-size:16px;font-weight:800">TIME UP</div><div style="margin-top:6px">Score: '+score+'</div><div style="margin-top:10px"><button id="startBtn2">Try Again</button></div>'; document.getElementById('startBtn2').addEventListener('click', ()=>{ startPanel.innerHTML=''; startPanel.style.display='none'; }); }
        if(targets.length===0){ running=false; startPanel.style.display='block'; startPanel.innerHTML = '<div style="font-size:16px;font-weight:800">YOU WIN</div><div style="margin-top:6px">Score: '+score+'</div><div style="margin-top:10px"><button id="startBtn2">Play Again</button></div>'; document.getElementById('startBtn2').addEventListener('click', ()=>{ startPanel.innerHTML=''; startPanel.style.display='none'; }); }
      }
    }

    function draw(){
      // background
      bctx.fillStyle = '#09202a'; bctx.fillRect(0,0,VW,VH);
      // draw map
      for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
          if(map[y][x]===1){ bctx.fillStyle = '#163a3f'; bctx.fillRect(x*tile, y*tile, tile, tile); }
          else { bctx.fillStyle = '#0e2b2f'; bctx.fillRect(x*tile, y*tile, tile, tile); }
        }
      }
      // draw targets
      for(const t of targets){ const p = worldToScreen(t.x,t.y); bctx.fillStyle='#ff6b6b'; bctx.fillRect(p.x - t.size/2, p.y - t.size/2, t.size, t.size); bctx.fillStyle='#111'; bctx.fillRect(p.x-1, p.y-1, 2, 2); }
      // draw player center
      const pcx = VW/2, pcy = VH/2; bctx.fillStyle='#9ff'; bctx.beginPath(); bctx.arc(pcx,pcy, Math.max(2, Math.floor(player.r*0.8)), 0, Math.PI*2); bctx.fill();
      // draw side gun
      const gx = VW - 68, gy = VH - 64; bctx.fillStyle='#f1c27d'; bctx.fillRect(gx+14, gy+24, 6, 10); bctx.fillStyle='#333'; bctx.fillRect(gx, gy+12, 48, 16); bctx.fillStyle='#666'; bctx.fillRect(gx+6, gy+8, 32, 6);
      // crosshair
      bctx.fillStyle='rgba(255,255,255,0.95)'; bctx.fillRect(mouse.x-1, mouse.y-8, 2, 16); bctx.fillRect(mouse.x-8, mouse.y-1, 16, 2);

      // draw debug: optional player world pos (hidden)
      // render to screen
      ctx.imageSmoothingEnabled = false; ctx.clearRect(0,0,W,H); ctx.drawImage(buffer,0,0,VW,VH,0,0,W,H);
    }

    function loop(ts){ if(!lastTime) lastTime = ts; const dt = ts - lastTime; lastTime = ts; if(running) update(dt); draw(); requestAnimationFrame(loop); }

    // preview on load
    generateMaze(); placeTargets(6); score = 0; scoreEl.textContent = 0; targetsEl.textContent = targets.length; draw();
  })();
  </script>
</body>
</html>
