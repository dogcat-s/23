<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maze Target Practice</title>
  <style>
    :root{--fg:#cfe8ff;--bg1:#07101a;--bg2:#030616}
    html,body{height:100%;margin:0;font-family:monospace,system-ui,Segoe UI,Roboto,Arial}
    body{background:linear-gradient(180deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;color:var(--fg)}
    #game-wrap{position:relative;width:960px;max-width:96vw;height:640px;background:#021025;box-shadow:0 8px 30px rgba(0,0,0,.7);border-radius:8px;overflow:hidden}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    .hud{position:absolute;left:8px;top:8px;font-weight:700;letter-spacing:.6px;font-size:14px}
    .controls{position:absolute;right:8px;top:8px;font-size:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));padding:6px 8px;border-radius:6px}
    .center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .panel{pointer-events:auto;background:rgba(0,0,0,0.75);padding:12px 14px;border-radius:6px;color:var(--fg);text-align:center;border:2px solid rgba(255,255,255,0.03)}
    .footer{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:rgba(255,255,255,.4);font-size:11px}
    .scanlines{position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(transparent, rgba(0,0,0,0.06) 1px);mix-blend-mode:overlay}
    @media (max-width:640px){#game-wrap{height:56vw}}
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="c"></canvas>
    <div class="scanlines"></div>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div style="margin-top:6px">Time: <span id="time">0</span>s &nbsp; Targets: <span id="targets">0</span></div>
    </div>
    <div class="controls">Move: W/A/S/D &nbsp; Shoot: Space or Click</div>
    <div class="center-msg"><div id="start-panel" class="panel"><div style="font-size:18px;font-weight:800">MAZE TARGET PRACTICE</div><div style="margin-top:8px;font-size:12px">Move with WASD. Face a direction and press Space or Click to shoot. Clear all targets before time runs out.</div><div style="margin-top:12px"><button id="startBtn">Start Round</button></div></div></div>
    <div class="footer">Top-down maze view • Side gun shown</div>
  </div>

  <script>
  (function(){
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('game-wrap');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const targetsEl = document.getElementById('targets');
    const startPanel = document.getElementById('start-panel');
    const startBtn = document.getElementById('startBtn');

    // virtual buffer
    const VW = 320, VH = 200;
    const buffer = document.createElement('canvas'); buffer.width = VW; buffer.height = VH;
    const bctx = buffer.getContext('2d'); bctx.imageSmoothingEnabled = false;

    let W=960,H=640;
    function resize(){ const r = wrap.getBoundingClientRect(); W = Math.floor(r.width); H = Math.floor(r.height); canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio; canvas.style.width = W+'px'; canvas.style.height = H+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
    window.addEventListener('resize', resize); resize();

    // room tiles (pokemon-like) — smaller tiles to make room larger
    const tile = 8; // tile size (smaller -> larger room)
    const cols = 52;
    const rows = 34;
    let map = [];

    function makeRoom(){
      map = new Array(rows); for(let y=0;y<rows;y++){ map[y]=new Array(cols).fill(0); }
      // walls on border
      for(let x=0;x<cols;x++){ map[0][x]=1; map[rows-1][x]=1; }
      for(let y=0;y<rows;y++){ map[y][0]=1; map[y][cols-1]=1; }
      // Build long wall sections with openings so the room feels like a maze.
      const verticalWalls = [9, 18, 28, 38, 47];
      verticalWalls.forEach((x, wallIndex)=>{
        const gap = 4 + (wallIndex * 5) % (rows - 8);
        for(let y=3;y<rows-3;y++) if(y < gap || y > gap + 2) map[y][x]=1;
      });
      const horizontalWalls = [7, 15, 24, 30];
      horizontalWalls.forEach((y, wallIndex)=>{
        const gap = 5 + (wallIndex * 9) % (cols - 10);
        for(let x=3;x<cols-3;x++) if(x < gap || x > gap + 3) map[y][x]=1;
      });
      // Add varied short wall pieces between the main sections.
      for(let i=0;i<22;i++){
        const rx = 3 + Math.floor(Math.random()*(cols-6));
        const ry = 3 + Math.floor(Math.random()*(rows-6));
        const horizontal = i % 2 === 0;
        const length = 2 + Math.floor(Math.random()*3);
        for(let step=0;step<length;step++){
          const x = rx + (horizontal ? step : 0);
          const y = ry + (horizontal ? 0 : step);
          if(x < cols-2 && y < rows-2) map[y][x]=1;
        }
      }
      connectMap();
    }

    function getReachable(){
      const reachable = new Set();
      const queue = [[1,1]];
      if(map[1][1]===1) map[1][1]=0;
      while(queue.length){
        const [x,y] = queue.shift();
        const key = x + ',' + y;
        if(reachable.has(key) || map[y][x]===1) continue;
        reachable.add(key);
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=x+dx, ny=y+dy;
          if(nx>0 && nx<cols-1 && ny>0 && ny<rows-1 && !reachable.has(nx+','+ny)) queue.push([nx,ny]);
        }
      }
      return reachable;
    }

    function connectMap(){
      let reachable = getReachable();
      let disconnected = true;
      while(disconnected){
        disconnected = false;
        for(let y=1;y<rows-1 && !disconnected;y++) for(let x=1;x<cols-1;x++){
          if(map[y][x]===1 || reachable.has(x+','+y)) continue;
          // Carve a simple doorway from this pocket toward the nearest reachable tile.
          let best = null, bestDistance = Infinity;
          for(const key of reachable){
            const parts = key.split(',').map(Number);
            const distance = Math.abs(parts[0]-x) + Math.abs(parts[1]-y);
            if(distance < bestDistance){ bestDistance=distance; best=parts; }
          }
          let cx=x, cy=y;
          while(cx!==best[0]){ map[cy][cx]=0; cx += cx<best[0] ? 1 : -1; }
          while(cy!==best[1]){ map[cy][cx]=0; cy += cy<best[1] ? 1 : -1; }
          map[cy][cx]=0;
          reachable = getReachable();
          disconnected = true;
          break;
        }
      }
    }

    // Try to load an external sprite sheet `player.png` (2x2 frames: down, up, left, right)
    const playerImg = new Image();
    let playerImgLoaded = false;
    const SPRITE_FRAME = 32; // assumed source frame size
    playerImg.onload = ()=>{ playerImgLoaded = true; };
    playerImg.onerror = ()=>{ playerImgLoaded = false; };
    // attempt to load from same directory
    playerImg.src = 'player.png';

    // player sprite (4-direction). If `player.png` is present it will be used (frames assumed 2x2):
    // layout assumed: [down | up]
    //                 [left | right]
    function drawPlayerSprite(ctx,x,y,s,dir){
      const px = x, py = y; const p = ctx;
      if(playerImgLoaded){
        // choose frame coords
        let sx=0, sy=0;
        if(dir==='down'){ sx = 0; sy = 0; }
        else if(dir==='up'){ sx = SPRITE_FRAME; sy = 0; }
        else if(dir==='left'){ sx = 0; sy = SPRITE_FRAME; }
        else if(dir==='right'){ sx = SPRITE_FRAME; sy = SPRITE_FRAME; }
        // draw scaled
        p.drawImage(playerImg, sx, sy, SPRITE_FRAME, SPRITE_FRAME, px, py, s, s);
        return;
      }
      // fallback: simple programmatic pixel figure
      const u = Math.max(1, Math.floor(s/8));
      p.fillStyle = '#c33'; p.fillRect(px + u*2, py + 0, u*4, u*2);
      p.fillStyle = '#811'; p.fillRect(px + u*3, py + Math.floor(u*0.5), u*2, Math.max(1,u));
      p.fillStyle = '#f4c27d'; p.fillRect(px + u*1, py + u*2, u*6, u*3);
      p.fillStyle = '#224'; p.fillRect(px + u*1, py + u*5, u*6, u*3);
      if(dir==='right'){ p.fillStyle = '#222'; p.fillRect(px + u*6, py + u*5, u*3, u*1); p.fillStyle = '#666'; p.fillRect(px + u*8, py + u*4, u*1, u*2); }
      else if(dir==='left'){ p.fillStyle = '#222'; p.fillRect(px - u*1 + 1, py + u*5, u*3, u*1); p.fillStyle = '#666'; p.fillRect(px - u*2 + 1, py + u*4, u*1, u*2); }
      else if(dir==='up'){ p.fillStyle = '#222'; p.fillRect(px + u*3, py + u*2 - u, u*3, u*1); p.fillStyle = '#666'; p.fillRect(px + u*5, py + u*1, u*1, u*2); }
      else { p.fillStyle = '#222'; p.fillRect(px + u*3, py + u*7, u*3, u*1); p.fillStyle = '#666'; p.fillRect(px + u*5, py + u*7, u*1, u*2); }
    }

    function drawTargetSprite(ctx,x,y){ ctx.fillStyle='#ff6b6b'; ctx.fillRect(x,y,10,10); ctx.fillStyle='#111'; ctx.fillRect(x+3,y+3,4,4); }

    const player = { x: VW/2, y: VH/2, sight:4, speed: 80, dir: 'down' };
    player.w = player.sight * 2; player.h = player.sight * 2;
    let keys = {};
    let bullets = [];
    let targets = [];
    let score = 0, timeLeft = 0, running=false, lastTime=0;

    function placeTargets(n){ targets = []; const free=[]; for(let y=1;y<rows-1;y++) for(let x=1;x<cols-1;x++) if(map[y][x]===0) free.push({x,y}); for(let i=0;i<n && free.length;i++){ const idx=Math.floor(Math.random()*free.length); const p = free.splice(idx,1)[0]; targets.push({ x: p.x*tile + tile/2 -5, y: p.y*tile + tile/2 -5, w:10, h:10, ox: Math.random()*1000 }); } }

    function spawnTarget(){
      const free=[];
      for(let y=1;y<rows-1;y++) for(let x=1;x<cols-1;x++){
        if(map[y][x]!==0) continue;
        const tx = x*tile + tile/2, ty = y*tile + tile/2;
        if(Math.hypot(tx-player.x, ty-player.y) < tile*3) continue;
        if(targets.some(t=>Math.hypot(tx-(t.x+t.w/2), ty-(t.y+t.h/2)) < tile*2)) continue;
        free.push({x,y});
      }
      if(!free.length) return;
      const p = free[Math.floor(Math.random()*free.length)];
      targets.push({ x: p.x*tile + tile/2 -5, y: p.y*tile + tile/2 -5, w:10, h:10, ox: Math.random()*1000 });
      targetsEl.textContent = targets.length;
    }

    const MAP_W = cols * tile, MAP_H = rows * tile;

    function canMove(nx,ny){ // check collision using player's bounding box corners
      const left = nx - player.sight, right = nx + player.sight - 1;
      const top = ny - player.sight, bottom = ny + player.sight - 1;
      const points = [ [left,top], [right,top], [left,bottom], [right,bottom] ];
      for(const p of points){ const cx = Math.floor(p[0] / tile), cy = Math.floor(p[1] / tile); if(cx<0||cx>=cols||cy<0||cy>=rows) return false; if(map[cy][cx]===1) return false; }
      return true;
    }

    function fireBulletDir(dir){ let vx=0,vy=0,speed=220; if(dir==='up') vy = -speed; else if(dir==='down') vy = speed; else if(dir==='left') vx = -speed; else if(dir==='right') vx = speed; const off = player.sight + 2; let bx = player.x, by = player.y; if(dir==='up') by -= off; else if(dir==='down') by += off; else if(dir==='left') bx -= off; else if(dir==='right') bx += off; bullets.push({x:bx,y:by,vx,vy,r:3}); }

    window.addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space'){ e.preventDefault(); fireBulletDir(player.dir); } });
    window.addEventListener('keyup', e=>{ keys[e.code]=false; });
    canvas.addEventListener('click', ()=>{ fireBulletDir(player.dir); });

    startBtn.addEventListener('click', ()=>{
      makeRoom(); placeTargets(12);
      // place player at center of first free tile
      for(let y=1;y<rows-1;y++){ let found=false; for(let x=1;x<cols-1;x++){ if(map[y][x]===0){ player.x = x*tile + tile/2; player.y = y*tile + tile/2; found=true; break; } } if(found) break; }
      timeLeft = 90; score = 0; scoreEl.textContent=0; targetsEl.textContent = targets.length; running=true; startPanel.style.display='none'; lastTime = performance.now(); requestAnimationFrame(loop);
    });

    function update(dt){ // dt ms
      const sp = player.speed * dt/1000; let nx = player.x, ny = player.y; if(keys['KeyA']) nx -= sp; if(keys['KeyD']) nx += sp; if(keys['KeyW']) ny -= sp; if(keys['KeyS']) ny += sp; if(canMove(nx,ny)){ player.x = nx; player.y = ny; }
      // bullets
      for(let i=bullets.length-1;i>=0;i--){ const b = bullets[i]; b.x += b.vx*dt/1000; b.y += b.vy*dt/1000; const cx = Math.floor(b.x / tile), cy = Math.floor(b.y / tile); if(cx<0||cx>=cols||cy<0||cy>=rows || map[cy][cx]===1){ bullets.splice(i,1); continue; } // wall
        // check targets
        for(let ti=targets.length-1;ti>=0;ti--){ const t=targets[ti]; const dx = b.x - (t.x + t.w/2), dy = b.y - (t.y + t.h/2); if(Math.hypot(dx,dy) < 10){ targets.splice(ti,1); score+=10; scoreEl.textContent = score; bullets.splice(i,1); spawnTarget(); break; } }
      }
      if(running){ timeLeft -= dt/1000; if(timeLeft<0) timeLeft=0; timeEl.textContent = Math.ceil(timeLeft); if(timeLeft<=0 && targets.length>0){ running=false; startPanel.style.display='block'; startPanel.innerHTML = '<div style="font-size:16px;font-weight:800">TIME UP</div><div style="margin-top:6px">Score: '+score+'</div><div style="margin-top:10px"><button id="startBtn2">Try Again</button></div>'; document.getElementById('startBtn2').addEventListener('click', ()=>{ startPanel.innerHTML=''; startPanel.style.display='none'; }); }
      }
    }

    function draw(){
      // simple camera that clamps to map edges so player can move visibly
      let camX = Math.floor(player.x - VW/2);
      let camY = Math.floor(player.y - VH/2);
      camX = Math.max(0, Math.min(camX, MAP_W - VW));
      camY = Math.max(0, Math.min(camY, MAP_H - VH));

      // background
      bctx.fillStyle = '#cbe8f0'; bctx.fillRect(0,0,VW,VH);
      // tiles: floor vs wall with Pokemon palette
      for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
          const sx = x*tile - camX, sy = y*tile - camY;
          if(sx+tile < 0 || sy+tile < 0 || sx > VW || sy > VH) continue;
          if(map[y][x]===1){ bctx.fillStyle = '#5b6b3a'; bctx.fillRect(sx,sy,tile,tile); bctx.fillStyle='rgba(0,0,0,0.12)'; bctx.fillRect(sx,sy+tile-3,tile,3); }
          else { bctx.fillStyle = '#b4d39a'; bctx.fillRect(sx,sy,tile,tile); }
        }
      }
      // targets (light movement)
      for(const t of targets){ t.x += Math.sin((performance.now()+t.ox)/700)*0.02; t.y += Math.cos((performance.now()+t.ox)/900)*0.02; const p = { x: Math.round(t.x - camX), y: Math.round(t.y - camY) }; drawTargetSprite(bctx, p.x-5, p.y-5); }
      // bullets
      for(const b of bullets){ const p = { x: Math.round(b.x - camX), y: Math.round(b.y - camY) }; bctx.fillStyle='#ffd86b'; bctx.fillRect(p.x-2,p.y-2,4,4); }
      // player at world position relative to camera
      const playerDrawX = Math.floor(player.x - camX - player.w/2), playerDrawY = Math.floor(player.y - camY - player.h/2);
      if(keys['KeyW']) player.dir = 'up'; else if(keys['KeyS']) player.dir = 'down'; else if(keys['KeyA']) player.dir = 'left'; else if(keys['KeyD']) player.dir = 'right';
      drawPlayerSprite(bctx, playerDrawX, playerDrawY, Math.max(player.w, player.h), player.dir);
      // side gun (smaller)
      const gx = VW - 48, gy = VH - 44; bctx.fillStyle='#e0b27d'; bctx.fillRect(gx+10, gy+18, 4, 8); bctx.fillStyle='#333'; bctx.fillRect(gx, gy+10, 36, 12); bctx.fillStyle='#666'; bctx.fillRect(gx+5, gy+6, 24, 5);
      // render
      ctx.imageSmoothingEnabled = false; ctx.clearRect(0,0,W,H); ctx.drawImage(buffer,0,0,VW,VH,0,0,W,H);
    }

    function loop(ts){ if(!lastTime) lastTime = ts; const dt = ts - lastTime; lastTime = ts; if(running) update(dt); draw(); requestAnimationFrame(loop); }

    // initial preview
    makeRoom(); placeTargets(10); score = 0; scoreEl.textContent = 0; targetsEl.textContent = targets.length; draw();
  })();
  </script>
</body>
</html>
