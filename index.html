<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maze Target Practice</title>
  <style>
    :root{--fg:#cfe8ff;--bg1:#07101a;--bg2:#030616}
    html,body{height:100%;margin:0;font-family:monospace,system-ui,Segoe UI,Roboto,Arial}
    body{background:linear-gradient(180deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;color:var(--fg)}
    #game-wrap{position:relative;width:960px;max-width:96vw;height:640px;background:#021025;box-shadow:0 8px 30px rgba(0,0,0,.7);border-radius:8px;overflow:hidden}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    .hud{position:absolute;left:8px;top:8px;font-weight:700;letter-spacing:.6px;font-size:14px}
    .controls{position:absolute;right:8px;top:8px;font-size:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));padding:6px 8px;border-radius:6px}
    .center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .panel{pointer-events:auto;background:rgba(0,0,0,0.75);padding:12px 14px;border-radius:6px;color:var(--fg);text-align:center;border:2px solid rgba(255,255,255,0.03)}
    .footer{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:rgba(255,255,255,.4);font-size:11px}
    .scanlines{position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(transparent, rgba(0,0,0,0.06) 1px);mix-blend-mode:overlay}
    @media (max-width:640px){#game-wrap{height:56vw}}
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="c"></canvas>
    <div class="scanlines"></div>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div style="margin-top:6px">Time: <span id="time">0</span>s &nbsp; Targets: <span id="targets">0</span></div>
    </div>
    <div class="controls">Move: W/A/S/D &nbsp; Shoot: Space or Click</div>
    <div class="center-msg"><div id="start-panel" class="panel"><div style="font-size:18px;font-weight:800">MAZE TARGET PRACTICE</div><div style="margin-top:8px;font-size:12px">Move with WASD. Aim with mouse. Shoot targets before time runs out.</div><div style="margin-top:12px"><button id="startBtn">Start Round</button></div></div></div>
    <div class="footer">Top-down maze view • Side gun shown</div>
  </div>

  <script>
  (function(){
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('game-wrap');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const targetsEl = document.getElementById('targets');
    const startPanel = document.getElementById('start-panel');
    const startBtn = document.getElementById('startBtn');

    // virtual buffer
    const VW = 320, VH = 200;
    const buffer = document.createElement('canvas'); buffer.width = VW; buffer.height = VH;
    const bctx = buffer.getContext('2d'); bctx.imageSmoothingEnabled = false;

    let W=960,H=640;
    function resize(){ const r = wrap.getBoundingClientRect(); W = Math.floor(r.width); H = Math.floor(r.height); canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio; canvas.style.width = W+'px'; canvas.style.height = H+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
    window.addEventListener('resize', resize); resize();

    // room tiles (pokemon-like)
    const tile = 16; // tile size
    const cols = Math.floor(VW / tile); // 20
    const rows = Math.floor(VH / tile); // 12
    let map = [];

    function makeRoom(){
      map = new Array(rows); for(let y=0;y<rows;y++){ map[y]=new Array(cols).fill(0); }
      // walls on border
      for(let x=0;x<cols;x++){ map[0][x]=1; map[rows-1][x]=1; }
      for(let y=0;y<rows;y++){ map[y][0]=1; map[y][cols-1]=1; }
      // add some interior obstacles
      for(let i=0;i<14;i++){ const rx = 2 + Math.floor(Math.random()*(cols-4)); const ry = 2 + Math.floor(Math.random()*(rows-4)); map[ry][rx]=1; }
    }

    // player sprite (16x16 pixel art) drawn programmatically
    function drawPlayerSprite(ctx,x,y,flip=false){
      // simple Pokemon-like trainer: red hat, orange face, blue clothes
      const px = x, py = y; // top-left of 16x16
      const p = ctx;
      p.fillStyle = '#c33'; p.fillRect(px+4,py+0,8,4); // hat
      p.fillStyle = '#811'; p.fillRect(px+6,py+1,4,2);
      p.fillStyle = '#f4c27d'; p.fillRect(px+5,py+4,6,4); // face
      p.fillStyle = '#224'; p.fillRect(px+4,py+8,8,6); // body
      // gun in hand (pixel)
      p.fillStyle = '#222'; p.fillRect(px+10,py+8,4,2); p.fillStyle='#666'; p.fillRect(px+12,py+7,2,2);
    }

    function drawTargetSprite(ctx,x,y){ ctx.fillStyle='#ff6b6b'; ctx.fillRect(x,y,12,12); ctx.fillStyle='#111'; ctx.fillRect(x+4,y+4,4,4); }

    const player = { x: VW/2, y: VH/2, w:12, h:16, speed: 80 };
    let keys = {};
    let mouse = {x:VW/2,y:VH/2};
    let bullets = [];
    let targets = [];
    let score = 0, timeLeft = 0, running=false, lastTime=0;

    function placeTargets(n){ targets = []; const free=[]; for(let y=1;y<rows-1;y++) for(let x=1;x<cols-1;x++) if(map[y][x]===0) free.push({x,y}); for(let i=0;i<n && free.length;i++){ const idx=Math.floor(Math.random()*free.length); const p = free.splice(idx,1)[0]; targets.push({ x: p.x*tile + tile/2 -6, y: p.y*tile + tile/2 -6, w:12, h:12 }); } }

    function worldToScreen(wx,wy){ return { x: Math.round(VW/2 + (wx - player.x)), y: Math.round(VH/2 + (wy - player.y)) }; }
    function screenToWorld(sx,sy){ return { x: player.x + (sx - VW/2), y: player.y + (sy - VH/2) }; }

    function canMove(nx,ny){ // check collision with tiles (player center)
      const cx = Math.floor(nx / tile), cy = Math.floor(ny / tile);
      if(cx<0||cx>=cols||cy<0||cy>=rows) return false; return map[cy][cx]===0;
    }

    function fireBullet(twx,twy){ const ax = twx - player.x, ay = twy - player.y; const len = Math.hypot(ax,ay); if(len===0) return; const vx = (ax/len)*220, vy = (ay/len)*220; bullets.push({x:player.x,y:player.y,vx,vy,r:3}); }

    window.addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space'){ e.preventDefault(); const tw = screenToWorld(mouse.x,mouse.y); fireBullet(tw.x, tw.y); } });
    window.addEventListener('keyup', e=>{ keys[e.code]=false; });
    canvas.addEventListener('mousemove', e=>{ const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left)/r.width*VW; mouse.y = (e.clientY - r.top)/r.height*VH; });
    canvas.addEventListener('click', ()=>{ const tw = screenToWorld(mouse.x,mouse.y); fireBullet(tw.x, tw.y); });

    startBtn.addEventListener('click', ()=>{
      makeRoom(); placeTargets(8);
      // place player at center of first free tile
      for(let y=1;y<rows-1;y++){ let found=false; for(let x=1;x<cols-1;x++){ if(map[y][x]===0){ player.x = x*tile + tile/2; player.y = y*tile + tile/2; found=true; break; } } if(found) break; }
      timeLeft = 90; score = 0; scoreEl.textContent=0; targetsEl.textContent = targets.length; running=true; startPanel.style.display='none'; lastTime = performance.now(); requestAnimationFrame(loop);
    });

    function update(dt){ // dt ms
      const sp = player.speed * dt/1000; let nx = player.x, ny = player.y; if(keys['KeyA']) nx -= sp; if(keys['KeyD']) nx += sp; if(keys['KeyW']) ny -= sp; if(keys['KeyS']) ny += sp; if(canMove(nx,ny)){ player.x = nx; player.y = ny; }
      // bullets
      for(let i=bullets.length-1;i>=0;i--){ const b = bullets[i]; b.x += b.vx*dt/1000; b.y += b.vy*dt/1000; const cx = Math.floor(b.x / tile), cy = Math.floor(b.y / tile); if(cx<0||cx>=cols||cy<0||cy>=rows || map[cy][cx]===1){ bullets.splice(i,1); continue; } // wall
        // check targets
        for(let ti=targets.length-1;ti>=0;ti--){ const t=targets[ti]; const dx = b.x - (t.x + t.w/2), dy = b.y - (t.y + t.h/2); if(Math.hypot(dx,dy) < 10){ targets.splice(ti,1); score+=10; scoreEl.textContent = score; targetsEl.textContent = targets.length; bullets.splice(i,1); break; } }
      }
      if(running){ timeLeft -= dt/1000; if(timeLeft<0) timeLeft=0; timeEl.textContent = Math.ceil(timeLeft); if(timeLeft<=0 && targets.length>0){ running=false; startPanel.style.display='block'; startPanel.innerHTML = '<div style="font-size:16px;font-weight:800">TIME UP</div><div style="margin-top:6px">Score: '+score+'</div><div style="margin-top:10px"><button id="startBtn2">Try Again</button></div>'; document.getElementById('startBtn2').addEventListener('click', ()=>{ startPanel.innerHTML=''; startPanel.style.display='none'; }); }
        if(targets.length===0){ running=false; startPanel.style.display='block'; startPanel.innerHTML = '<div style="font-size:16px;font-weight:800">YOU WIN</div><div style="margin-top:6px">Score: '+score+'</div><div style="margin-top:10px"><button id="startBtn2">Play Again</button></div>'; document.getElementById('startBtn2').addEventListener('click', ()=>{ startPanel.innerHTML=''; startPanel.style.display='none'; }); }
      }
    }

    function draw(){
      // background
      bctx.fillStyle = '#cbe8f0'; bctx.fillRect(0,0,VW,VH);
      // tiles: floor vs wall with Pokemon palette
      for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
          const sx = x*tile, sy = y*tile;
          if(map[y][x]===1){ bctx.fillStyle = '#5b6b3a'; bctx.fillRect(sx,sy,tile,tile); bctx.fillStyle='rgba(0,0,0,0.12)'; bctx.fillRect(sx,sy+tile-3,tile,3); }
          else { bctx.fillStyle = '#b4d39a'; bctx.fillRect(sx,sy,tile,tile); }
        }
      }
      // targets
      for(const t of targets){ const p = worldToScreen(t.x + t.w/2, t.y + t.h/2); drawTargetSprite(bctx, p.x-6, p.y-6); }
      // bullets
      for(const b of bullets){ const p = worldToScreen(b.x,b.y); bctx.fillStyle='#ffd86b'; bctx.fillRect(p.x-2,p.y-2,4,4); }
      // player at center
      const playerDrawX = Math.floor(VW/2 - player.w/2), playerDrawY = Math.floor(VH/2 - player.h/2);
      drawPlayerSprite(bctx, playerDrawX, playerDrawY);
      // side gun large
      const gx = VW - 68, gy = VH - 64; bctx.fillStyle='#e0b27d'; bctx.fillRect(gx+14, gy+24, 6, 10); bctx.fillStyle='#333'; bctx.fillRect(gx, gy+12, 48, 16); bctx.fillStyle='#666'; bctx.fillRect(gx+6, gy+8, 32, 6);
      // crosshair
      bctx.fillStyle='rgba(255,255,255,0.95)'; bctx.fillRect(mouse.x-1, mouse.y-8, 2, 16); bctx.fillRect(mouse.x-8, mouse.y-1, 16, 2);
      // render
      ctx.imageSmoothingEnabled = false; ctx.clearRect(0,0,W,H); ctx.drawImage(buffer,0,0,VW,VH,0,0,W,H);
    }

    function loop(ts){ if(!lastTime) lastTime = ts; const dt = ts - lastTime; lastTime = ts; if(running) update(dt); draw(); requestAnimationFrame(loop); }

    // initial preview
    makeRoom(); placeTargets(6); score = 0; scoreEl.textContent = 0; targetsEl.textContent = targets.length; draw();
  })();
  </script>
</body>
</html>
