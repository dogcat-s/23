<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Retro Pixel Shooter</title>
	<style>
		:root{--fg:#cfe8ff;--bg1:#07101a;--bg2:#030616}
		html,body{height:100%;margin:0;font-family:monospace,system-ui,Segoe UI,Roboto,Arial}
		body{background:linear-gradient(180deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;color:var(--fg)}
		#game-wrap{position:relative;width:960px;max-width:96vw;height:640px;background:#021025 box-shadow:0 8px 30px rgba(0,0,0,.7);border-radius:8px;overflow:hidden}
		canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
		.hud{position:absolute;left:8px;top:8px;font-weight:700;letter-spacing:.6px;font-size:14px}
		.hud .score{font-size:14px}
		.hud .info{font-size:12px;opacity:.95;margin-top:6px}
		.center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
		.panel{pointer-events:auto;background:rgba(0,0,0,0.65);padding:10px 14px;border-radius:6px;color:var(--fg);text-align:center;border:2px solid rgba(255,255,255,0.03)}
		.controls{position:absolute;right:8px;top:8px;font-size:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));padding:6px 8px;border-radius:6px}
		.footer{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:rgba(255,255,255,.4);font-size:11px}
		.scanlines{position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(transparent, rgba(0,0,0,0.06) 1px);mix-blend-mode:overlay}
		@media (max-width:640px){#game-wrap{height:56vw}}
	</style>
</head>
<body>
	<div id="game-wrap">
		<canvas id="c"></canvas>
		<div class="scanlines"></div>
		<div class="hud">
			<div class="score">Score: <span id="score">0</span></div>
			<div class="info">Time: <span id="time">0</span>s &nbsp; Targets: <span id="targets">0</span></div>
		</div>
		<div class="controls">Move: W/A/S/D or WASD &nbsp; Shoot: Space</div>
		<div class="center-msg"><div id="start-panel" class="panel"><div style="font-size:16px;font-weight:800">TARGET PRACTICE</div><div style="margin-top:8px;font-size:12px">Move with WASD, aim with center crosshair. Shoot all targets before time runs out.</div><div style="margin-top:10px"><button id="startBtn">Start Round</button></div></div></div>
		<div class="footer">Nearest-neighbor scaling + scanlines</div>
	</div>

	<script>
	(function(){
		const canvas = document.getElementById('c');
		const ctx = canvas.getContext('2d');
		const wrap = document.getElementById('game-wrap');
		const scoreEl = document.getElementById('score');
		const livesEl = document.getElementById('lives');
		const startPanel = document.getElementById('start-panel');
		const startBtn = document.getElementById('startBtn');

		// Virtual low-res buffer (retro feel)
		const VW = 320, VH = 200; // virtual resolution
		const buffer = document.createElement('canvas'); buffer.width = VW; buffer.height = VH;
		const bctx = buffer.getContext('2d'); bctx.imageSmoothingEnabled = false;

		let W=960,H=640;
		function resize(){
			const r = wrap.getBoundingClientRect(); W = Math.floor(r.width); H = Math.floor(r.height);
			canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
			canvas.style.width = W+'px'; canvas.style.height = H+'px';
			ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
			// main canvas will display scaled buffer, but buffer keeps fixed VWxVH
		}
		window.addEventListener('resize', resize); resize();

		// Retro palette and simple flat camera
		const groundOffset = 20;

		// Player in world coords (2D plane)
		const player = {x:0,y:0, speed:2.5}

		let targets = [];
		let score = 0;
		let timeLeft = 0; // seconds
		let canShoot = true;
		let keys = {};
		let running = false;
		let lastSpawn=0, spawnInterval=900;
		let lastTime=0;

		function worldToScreen(p){
			const scale = FOCAL / (FOCAL + p.z);
			const cx = VW/2;
			const cy = VH/2 + groundOffset*0.5;
			return {x: Math.round(cx + p.x*scale), y: Math.round(cy + p.y*scale + (1-scale)*groundOffset), scale };
		}

		function spawnTarget(x,y){
			const xpos = (typeof x==='number')? x : Math.round((Math.random()*2-1) * 120);
			const ypos = (typeof y==='number')? y : Math.round((Math.random()*2-1) * 50);
			const size = 8 + Math.floor(Math.random()*8);
			targets.push({x:xpos,y:ypos,size});
		}

		function shoot(){
			if(!canShoot) return;
			canShoot = false; setTimeout(()=> canShoot = true, 160);
			// raycast from center crosshair: hit any target near center
			const cx = 0, cy = 0; // in world offsets relative to player
			const HIT_RADIUS = 18;
			for(let i=targets.length-1;i>=0;i--){
				const t = targets[i];
				const dx = t.x - player.x; const dy = t.y - player.y;
				// screen pos is simply (dx,dy) offset from center scaled 1:1
				const dist = Math.sqrt(dx*dx + dy*dy);
				if(dist < HIT_RADIUS){ targets.splice(i,1); score += 10; scoreEl.textContent = score; document.getElementById('targets').textContent = targets.length; break; }
			}
		}

		function reset(){ targets = []; score=0; scoreEl.textContent=score; lastSpawn=0; running=true; startPanel.style.display='none';
			// configure round
			const TOTAL = 7;
			timeLeft = 40; // seconds
			document.getElementById('time').textContent = timeLeft;
			document.getElementById('targets').textContent = TOTAL;
			for(let i=0;i<TOTAL;i++) spawnTarget();
		}

		window.addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space'){ e.preventDefault(); if(running) shoot(); }});
		window.addEventListener('keyup', e=>{ keys[e.code]=false });
		startBtn.addEventListener('click', ()=>{ reset(); lastTime=performance.now(); requestAnimationFrame(loop); });

		function update(dt){
			// movement: WASD moves player on flat plane
			if(keys['KeyA']) player.x -= player.speed * (dt/16);
			if(keys['KeyD']) player.x += player.speed * (dt/16);
			if(keys['KeyW']) player.y -= player.speed * (dt/16);
			if(keys['KeyS']) player.y += player.speed * (dt/16);
			player.x = Math.max(-160, Math.min(160, player.x));
			player.y = Math.max(-80, Math.min(80, player.y));

			for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i]; b.z -= b.spd * dt/16; if(b.z<=0) bullets.splice(i,1); }

			// timer
			if(running){ timeLeft -= dt/1000; if(timeLeft < 0) timeLeft = 0; document.getElementById('time').textContent = Math.ceil(timeLeft);
				if(timeLeft<=0 && targets.length>0){ running=false; startPanel.style.display='block'; startPanel.innerHTML = '<div style="font-size:16px;font-weight:800">TIME UP</div><div style="margin-top:6px">Score: '+score+'</div><div style="margin-top:10px"><button id="startBtn2">Try Again</button></div>'; document.getElementById('startBtn2').addEventListener('click', ()=>{ startPanel.innerHTML=''; startPanel.style.display='none'; reset(); requestAnimationFrame(loop); }); }
				if(targets.length===0){ running=false; startPanel.style.display='block'; startPanel.innerHTML = '<div style="font-size:16px;font-weight:800">YOU WIN</div><div style="margin-top:6px">Score: '+score+'</div><div style="margin-top:10px"><button id="startBtn2">Play Again</button></div>'; document.getElementById('startBtn2').addEventListener('click', ()=>{ startPanel.innerHTML=''; startPanel.style.display='none'; reset(); requestAnimationFrame(loop); }); }
			}
		}

		function drawSceneToBuffer(){
			// clear buffer
			bctx.fillStyle = '#021022'; bctx.fillRect(0,0,VW,VH);

			// ground (retro stripes)
			bctx.fillStyle = '#061731'; bctx.fillRect(0, VH/2 + groundOffset - 8, VW, VH/2 + 12);
			for(let i=0;i<10;i++){ bctx.fillStyle = i%2? 'rgba(255,255,255,0.02)':'rgba(0,0,0,0)'; bctx.fillRect(0, VH/2 + groundOffset + i*2, VW, 1); }

			// draw enemies and bullets sorted by z
			const drawList = [];
			targets.forEach(e=>drawList.push({type:'target',o:e}));
			drawList.sort((a,b)=> (a.o.z||0) - (b.o.z||0));

			drawList.forEach(item=>{
				if(item.type==='target'){
					const e = item.o;
					const p = { x: Math.round(VW/2 + (e.x - player.x)), y: Math.round(VH/2 + (e.y - player.y)) };
					const w = Math.max(6, e.size);
					// simple flat target square
					bctx.fillStyle='rgba(0,0,0,0.25)'; bctx.fillRect(p.x - Math.floor(w/2), p.y + Math.floor(w/2), w, 2);
					bctx.fillStyle = '#66d9ff'; bctx.fillRect(p.x - Math.floor(w/2), p.y - Math.floor(w/2), w, w);
					bctx.fillStyle = '#012'; bctx.fillRect(p.x-1, p.y-1, 2, 2);
				}
			});

			// draw large side-view gun (lower-right)
			const gx = VW - 56;
			const gy = VH - 48;
			// arm
			bctx.fillStyle = '#f1c27d'; bctx.fillRect(gx+6, gy+10, 4, 6);
			// hand
			bctx.fillRect(gx+10, gy+12, 4, 4);
			// big gun body
			bctx.fillStyle = '#222'; bctx.fillRect(gx, gy+4, 36, 10);
			bctx.fillStyle = '#555'; bctx.fillRect(gx+2, gy+2, 28, 4);
			bctx.fillStyle = '#111'; bctx.fillRect(gx+34, gy+6, 6, 4);
			// highlight
			bctx.fillStyle = '#99a'; bctx.fillRect(gx+4, gy+6, 6, 2);
			// draw crosshair
			bctx.fillStyle = 'rgba(255,255,255,0.55)'; bctx.fillRect(VW/2-1, VH/2-6, 2, 12); bctx.fillRect(VW/2-6, VH/2-1, 12, 2);
		}

		function renderToScreen(){
			// scale buffer to main canvas (nearest)
			ctx.imageSmoothingEnabled = false; ctx.clearRect(0,0,W,H);
			ctx.drawImage(buffer, 0, 0, VW, VH, 0, 0, W, H);
		}

		function draw(){ drawSceneToBuffer(); renderToScreen(); }

		function loop(ts){ if(!lastTime) lastTime=ts; const dt = ts-lastTime; lastTime = ts; if(running){ update(dt); draw(); requestAnimationFrame(loop); } }

		for(let i=0;i<4;i++) spawnEnemy(); draw();
	})();
	</script>
</body>
</html>
